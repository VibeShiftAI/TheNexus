name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint (if configured)
      run: npm run lint --if-present
      continue-on-error: true

  build:
    needs: lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    # @praxis/contract is the sibling repo nexus-shared (one copy, shared by the
    # root server and the dashboard via file:../nexus-shared / file:../../nexus-shared).
    # nexus-shared is a PRIVATE repo, so a plain clone fails. Requires the repo
    # secret NEXUS_SHARED_READ_TOKEN: a fine-grained PAT with Contents: read on
    # VibeShiftAI/nexus-shared. actions/checkout cannot write outside the
    # workspace, so check out into a subdir and symlink it to ../nexus-shared.
    - name: Check out @praxis/contract (nexus-shared)
      uses: actions/checkout@v4
      with:
        repository: VibeShiftAI/nexus-shared
        token: ${{ secrets.NEXUS_SHARED_READ_TOKEN }}
        path: .nexus-shared-src

    - name: Link nexus-shared as a sibling and build @praxis/contract
      run: |
        ln -sfn "$GITHUB_WORKSPACE/.nexus-shared-src" ../nexus-shared
        cd ../nexus-shared && npm install && npm run build

    - name: Install root dependencies
      run: npm ci
    
    
    - name: Install dashboard dependencies
      working-directory: dashboard
      run: npm ci
    
    - name: Build dashboard
      working-directory: dashboard
      run: npm run build

  # Deploy job only runs on main branch
  # Actual deployment is handled by Netlify, this is just for status
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deployment Status
      run: |
        echo "Build successful! Deployment is handled by Netlify."
        echo "Check Netlify dashboard for deployment status."