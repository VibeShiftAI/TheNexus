# Vibe Coding OS — Model Registry
# Role-to-model mappings for the simplified Nexus pipeline
#
# Strategy: Local model is the primary driver/orchestrator for all standard
# pipeline roles. Cloud models are reserved for the Cortex Council (reviewer
# pool) where provider diversity prevents groupthink.

defaults:
  temperature: 0.7
  max_retries: 3

# 1. Define Physical Models
models:
  # ── Local Model (Primary Driver) ─────────────────────────────
  local-default:
    provider: local
    family: Local
    model_name: qwen3:32b
    context_window: 131072
    capabilities: ["reasoning", "code", "tool_use"]
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0

  # ── Cloud Models (Council & Fallback) ────────────────────────
  gpt-5.2:
    provider: openai
    family: GPT
    model_name: gpt-5.2-pro
    context_window: 128000
    capabilities: ["reasoning", "code", "tool_use", "vision"]
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015
  
  gpt-5.2-codex:
    provider: openai
    family: GPT
    model_name: gpt-5.2-codex
    context_window: 128000
    capabilities: ["code", "agentic", "tool_use"]
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015

  gpt-5-mini:
    provider: openai
    family: GPT
    model_name: gpt-5-mini-2025-08-07
    context_window: 128000
    capabilities: ["reasoning", "code", "tool_use"]
    cost_per_1k_input: 0.0015
    cost_per_1k_output: 0.006

  claude-opus:
    provider: anthropic
    family: Claude
    model_name: claude-opus-4-6
    context_window: 1000000
    capabilities: ["reasoning", "code", "extended_thinking"]
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075

  gemini-pro:
    provider: google
    family: Gemini
    model_name: gemini-3.1-pro-preview
    context_window: 1000000
    capabilities: ["reasoning", "multimodal", "deep_think"]
    cost_per_1k_input: 0.00025
    cost_per_1k_output: 0.0005

  gemini-flash:
    provider: google
    family: Gemini
    model_name: gemini-3-flash-preview
    context_window: 1000000
    capabilities: ["fast", "multimodal", "configurable_thinking"]
    cost_per_1k_input: 0.0000375
    cost_per_1k_output: 0.00015

  grok-4.1:
    provider: xai
    family: Grok
    model_name: grok-4-1-fast-reasoning
    context_window: 131072
    capabilities: ["reasoning", "multimodal", "realtime_data"]
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015

  claude-sonnet:
    provider: anthropic
    family: Claude
    model_name: claude-sonnet-4-6
    context_window: 200000
    capabilities: ["reasoning", "code", "tool_use"]
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015

# 2. Define Logical Roles
roles:
  # ── PRIMARY PIPELINE — All routed to local model ─────────────

  # Lead Architect — plans projects (local primary)
  proposer:
    strategy: fixed
    model: local-default
    temperature: 0.9
    description: "Lead Architect — local model as primary orchestrator"

  # Chat Router — lightweight intent detection
  router:
    strategy: fixed
    model: local-default
    temperature: 0.0
    description: "Chat/Build intent classification — local model for zero-cost routing"

  # Recursive Browser Agent
  browser:
    strategy: fixed
    model: local-default
    temperature: 0.1
    description: "Recursive web browsing — local model for URL selection and content evaluation"

  # Visual Interpreter — Multi-modal image analysis
  # NOTE: Falls back to local but may need cloud for vision-heavy tasks
  visual_interpreter:
    strategy: fixed
    model: local-default
    temperature: 0.1
    description: "Multi-modal image analysis — local model (override to cloud for vision)"

  # Nexus Builder — Code generation (downstream execution)
  architect:
    strategy: fixed
    model: local-default
    temperature: 0.3
    description: "System design and deep planning — local model"

  builder:
    strategy: fixed
    model: local-default
    temperature: 0.2
    description: "Code generation and execution — local model"

  # Entity Extraction (kept for hashtag manager)
  entity_extractor:
    strategy: fixed
    model: local-default
    temperature: 0.1
    description: "Fast entity/keyword extraction — local model"

  # Orchestrator meta-reasoning (kept for backward compat)
  orchestrator:
    strategy: fixed
    model: local-default
    temperature: 0.2
    description: "Meta-reasoning and task decomposition — local model"

  youtube_router:
    strategy: fixed
    model: local-default
    temperature: 0.0
    description: "YouTube workflow request classification and channel/profile routing"

  youtube_researcher:
    strategy: fixed
    model: local-default
    temperature: 0.2
    description: "YouTube workflow research summarization with local-first context"

  youtube_strategist:
    strategy: fixed
    model: local-default
    temperature: 0.5
    description: "YouTube concept, audience, promise, and retention structure"

  youtube_scriptwriter:
    strategy: fixed
    model: local-default
    temperature: 0.7
    description: "YouTube scene-by-scene scriptwriting"

  youtube_producer:
    strategy: fixed
    model: local-default
    temperature: 0.3
    description: "YouTube production plans and render prompts"

  youtube_compliance:
    strategy: fixed
    model: local-default
    temperature: 0.1
    description: "YouTube AI disclosure, originality, cadence, and upload policy checks"

  # ── CORTEX COUNCIL — Cloud diversity preserved ───────────────
  # The reviewer pool keeps multi-provider shuffle for anti-groupthink.
  # min_providers=2 is enforced by council.py at call time.
  reviewer:
    strategy: shuffle
    pool: [gemini-flash, gpt-5-mini, claude-sonnet, grok-4.1]
    temperature: 0.3
    description: "Council reviewers — shuffled diverse CLOUD models for anti-groupthink"

# Shuffle Configuration
shuffle:
  enabled: false
  seed: null
