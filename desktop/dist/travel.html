<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Nexus — tabs</title>
<style>
  html, body { height: 100%; margin: 0; background: #020617; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  .bar { height: 100%; display: flex; align-items: stretch; gap: 5px; padding: 0 10px;
    box-sizing: border-box; border-bottom: 1px solid #0f1e33; }
  .brand { display: flex; align-items: center; color: #334155; font-size: 11px;
    font-weight: 700; letter-spacing: 0.22em; padding: 0 10px 0 4px; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 0 11px; margin: 7px 0;
    border: 1px solid transparent; border-radius: 8px; cursor: default; white-space: nowrap;
    color: #64748b; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
  .tab:hover { color: #94a3b8; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.5; }
  .tab.active { color: var(--accent); border-color: var(--border);
    background: var(--bg); box-shadow: 0 0 14px var(--shadow); }
  .tab.active .dot { opacity: 1; box-shadow: 0 0 8px currentColor; }
  .spacer { flex: 1; }
  .btn { display: flex; align-items: center; padding: 0 12px; margin: 7px 0;
    border: 1px solid transparent; border-radius: 8px; color: #64748b; font-size: 15px; }
  .btn:hover { color: #e2e8f0; border-color: #1e293b; background: rgba(148, 163, 184, 0.06); }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="brand">THE NEXUS</div>
  <div class="spacer"></div>
  <div class="btn" id="reload" title="Reload current tab">&#10227;</div>
</div>
<script>
  // Tab roster comes from Rust (travel::TABS) so growing the ecosystem is a
  // one-line change there. Local app pages get IPC; the remote content that
  // replaces the loaders gets none.
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

  function glow(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  async function boot() {
    if (!invoke) return;
    const tabs = await invoke("list_tabs");
    const bar = document.getElementById("bar");
    const spacer = bar.querySelector(".spacer");
    tabs.forEach((tab, index) => {
      const el = document.createElement("div");
      el.className = "tab" + (index === 0 ? " active" : "");
      el.dataset.tab = tab.id;
      el.style.setProperty("--accent", tab.accent);
      el.style.setProperty("--border", glow(tab.accent, 0.35));
      el.style.setProperty("--bg", glow(tab.accent, 0.08));
      el.style.setProperty("--shadow", glow(tab.accent, 0.15));
      el.innerHTML = '<span class="dot"></span>';
      el.appendChild(document.createTextNode(tab.label));
      el.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === el));
        invoke("switch_tab", { tab: tab.id });
      });
      bar.insertBefore(el, spacer);
    });
  }
  boot();

  document.getElementById("reload").addEventListener("click", () => {
    if (invoke) invoke("reload_active");
  });
</script>
</body>
</html>
