[package]
name = "nexus-desktop"
version = "1.0.0"
description = "Native shell for The Nexus bridge dashboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
