[package]
name = "nexus-desktop"
version = "1.0.0"
description = "Native shell for The Nexus bridge dashboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews (Window::add_child) for the Windows
# travel shell's tab strip + content views.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# System-default-browser opener for target=_blank links (status reports).
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
