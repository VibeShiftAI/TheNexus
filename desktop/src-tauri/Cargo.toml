[package]
name = "nexus-desktop"
version = "1.3.0"
description = "Native shell for The Nexus bridge dashboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews (Window::add_child) for the Windows
# travel shell's tab strip + content views.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# System-default-browser opener for target=_blank links (status reports).
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Cloudflare Access service-token exchange at startup. native-tls = schannel,
# avoiding ring/rustls (fussy to build on aarch64-pc-windows-msvc).
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# Self-updater: pulls signed builds from the tunnel (nexus.vibeshiftai.com),
# carrying the same Access service token. native-tls (schannel) instead of the
# default rustls keeps ring — and its Windows C toolchain need — out of the
# tree, matching ureq above. Dialog plugin drives the update prompt.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
